<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legends FC</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f7;--sf:#fff;--tx:#14181f;--mu:#667085;--bd:#dfe3ea;--ac:#1a7f4b;--acx:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--sf:#181d26;--tx:#eef1f6;--mu:#9aa4b5;--bd:#2a3140;--ac:#33c27a;--acx:#06210f}}
:root[data-theme="dark"]{--bg:#0e1116;--sf:#181d26;--tx:#eef1f6;--mu:#9aa4b5;--bd:#2a3140;--ac:#33c27a;--acx:#06210f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:18px 0 8px}
nav{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
nav button{flex:1 0 auto;padding:10px 12px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;margin-top:10px}
.btn.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:6px 10px;margin:0;font-weight:600;font-size:13px}
.btn.on{background:#d9534f;color:#fff;border-color:#d9534f}
.mu{color:var(--mu);font-size:13px}.score{font-size:22px;font-weight:800}
.pr{display:grid;grid-template-columns:auto 1fr repeat(4,52px);gap:6px;align-items:center;margin:5px 0}
.pr input[type=number]{padding:6px 4px;text-align:center}.pr input[type=checkbox]{width:auto}
.att{display:grid;grid-template-columns:70px 1fr 28px;gap:8px;align-items:center;font-size:13px}.att input{padding:6px;max-width:90px}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--bd);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:var(--mu);cursor:pointer;flex:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(246px,1fr));gap:26px 18px;justify-items:center}
.card{--rx:0deg;--ry:0deg;--mx:50%;--my:25%;--g:0;position:relative;overflow:hidden;width:240px;padding:14px 16px 22px;border-radius:22px 22px 84px 84px/22px 22px 50px 50px;color:var(--t);text-align:center;isolation:isolate;
 background:radial-gradient(120% 60% at 50% 0,var(--hi),transparent 62%),linear-gradient(160deg,var(--c1),var(--c2) 52%,var(--c3));
 box-shadow:0 16px 28px rgba(0,0,0,.42),0 2px 0 rgba(255,255,255,.55) inset,0 -8px 12px rgba(0,0,0,.35) inset,0 0 0 3px var(--rim) inset,0 0 0 6px rgba(0,0,0,.16) inset;
 transform:perspective(800px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .12s ease-out}
.card::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--logo) 50% 72%/88% no-repeat,repeating-linear-gradient(115deg,rgba(255,255,255,.08) 0 2px,transparent 2px 10px);filter:var(--wm);opacity:var(--wo)}
.card::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;opacity:var(--g);transition:opacity .2s;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.55),transparent 42%)}
.card.bronze{--c1:#f2b784;--c2:#b4742f;--c3:#693b12;--hi:rgba(255,226,192,.6);--rim:rgba(255,226,190,.6);--t:#2b1707;--ts:0 1px 0 rgba(255,235,210,.6),0 -1px 0 rgba(0,0,0,.25);--wm:brightness(0);--wo:.1}
.card.plata{--c1:#ffffff;--c2:#b9c0cb;--c3:#6a7383;--hi:rgba(255,255,255,.85);--rim:rgba(255,255,255,.9);--t:#1c2230;--ts:0 1px 0 rgba(255,255,255,.8),0 -1px 0 rgba(0,0,0,.2);--wm:brightness(0);--wo:.09}
.card.or{--c1:#fff6b8;--c2:#e6b92e;--c3:#946500;--hi:rgba(255,252,210,.8);--rim:rgba(255,246,190,.85);--t:#3a2900;--ts:0 1px 0 rgba(255,250,200,.75),0 -1px 0 rgba(0,0,0,.25);--wm:brightness(0);--wo:.1}
.card.mvp{--hi:rgba(255,255,255,.4);--rim:rgba(255,255,255,.75);--t:#fff;--ts:0 2px 3px rgba(0,0,0,.6);--wm:none;--wo:.16;background:radial-gradient(120% 60% at 50% 0,var(--hi),transparent 62%),linear-gradient(135deg,#0ee7ff,#6b4dff 28%,#c13cff 52%,#2b1a9e 76%,#0ee7ff);background-size:auto,300% 300%;animation:holo 7s ease-in-out infinite}
@keyframes holo{0%,100%{background-position:0 0,0% 50%}50%{background-position:0 0,100% 50%}}
.side{position:absolute;left:10px;top:14px;width:56px;display:flex;flex-direction:column;align-items:center;gap:3px;z-index:2}
.phw{display:flex;justify-content:flex-end;min-height:156px}
.ovr{font-size:44px;font-weight:900;line-height:.95;text-shadow:var(--ts),0 3px 6px rgba(0,0,0,.25)}
.tag{font-size:10.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin-top:8px;min-height:14px;line-height:14px;text-shadow:var(--ts)}
.pos{font-size:15px;font-weight:900;letter-spacing:.08em;border-top:2px solid currentColor;padding-top:1px;text-shadow:var(--ts)}
.lg{display:inline-block;width:34px;height:34px;border-radius:50%;background:#0b0b0b var(--logo) center/80% no-repeat;box-shadow:0 2px 6px rgba(0,0,0,.5),0 0 0 2px rgba(255,255,255,.5)}
.ph{flex:none;width:156px;height:156px;border-radius:50%;object-fit:cover;margin:0;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:900;border:3px solid rgba(255,255,255,.8);box-shadow:0 6px 12px rgba(0,0,0,.45),0 0 0 2px rgba(0,0,0,.18),inset 0 0 12px rgba(0,0,0,.25);background:rgba(255,255,255,.28)}
.nm{font-size:19px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;margin:9px 0 7px;padding-bottom:6px;border-bottom:2px solid transparent;border-image:linear-gradient(90deg,transparent,currentColor,transparent) 1;text-shadow:var(--ts);white-space:nowrap;overflow:hidden;line-height:28px;height:36px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:3px 0;font-weight:900;font-size:16px;padding:0 4px;text-shadow:var(--ts)}
.st span{display:flex;gap:6px;justify-content:center}.st span:nth-child(odd){border-right:1px solid rgba(0,0,0,.22)}
.st b{font-weight:900}.st i{font-style:normal;font-weight:700;opacity:.8}
.ft{margin:11px auto 0;display:inline-block;font-size:11px;font-weight:800;background:rgba(0,0,0,.16);border-radius:999px;padding:4px 10px}
.hero{position:relative;display:flex;align-items:center;gap:16px;background:radial-gradient(120% 150% at 0 0,#33290a,#0b0b0b 62%);border:1px solid #3d3110;border-radius:18px;padding:14px 18px;margin-bottom:14px}
.hero i{flex:none;width:104px;height:104px;background:var(--logo) center/contain no-repeat;filter:drop-shadow(0 4px 12px rgba(0,0,0,.7))}
.hero h1{margin:0;font-size:30px;letter-spacing:.09em;color:#f3c64a;text-shadow:0 2px 0 #000,0 0 18px rgba(243,198,74,.35)}
.lang{position:absolute;top:10px;right:12px;display:flex;gap:4px}.lang button{background:transparent;color:#b8a468;border:1px solid #5a4a18;border-radius:8px;padding:3px 9px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.lang button.on{background:#f3c64a;color:#1a1400;border-color:#f3c64a}
.hero p{margin:2px 0 0;color:#b8a468;font-size:13px}
.del{background:none;border:0;color:var(--mu);cursor:pointer;float:right}
.rt{border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-top:6px}
.rt .pr{margin:0;padding:8px 10px;gap:4px;border-bottom:1px solid var(--bd);grid-template-columns:22px minmax(0,1fr) repeat(4,50px)}
.rt .pr:last-child,.rt .mnr:last-child{border-bottom:0}
.rt .pr.hd{background:var(--bg);font-size:10px;font-weight:700;color:var(--mu);text-align:center;line-height:1.2;padding:6px 10px}
.rt .pr.hd span:nth-child(2){text-align:left;align-self:end}
.rt .pr.on{background:color-mix(in srgb,var(--ac) 9%,var(--sf));border-bottom-color:transparent}
.rt .pr input[type=checkbox]{width:18px;height:18px;padding:0}
.rt .pr input[type=number]{padding:8px 2px;font-weight:700}
.rt .pr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt .mnr{padding:0 10px 8px 32px;border-bottom:1px solid var(--bd);background:color-mix(in srgb,var(--ac) 9%,var(--sf))}
.rt .mnr input{font-size:13px;padding:6px 8px}
input.cy{border-color:#e6b800;background:color-mix(in srgb,#e6b800 12%,var(--bg))}
input.cr{border-color:#d9534f;background:color-mix(in srgb,#d9534f 12%,var(--bg))}
.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th,.tb td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
.tb th{cursor:pointer;font-size:13px;background:var(--bg);user-select:none}
.tb th:first-child,.tb td:first-child{text-align:left}
.tb tbody tr:nth-child(even){background:color-mix(in srgb,var(--bd) 25%,transparent)}
.tb tfoot td{font-weight:800;border-bottom:0;background:var(--bg)}
.avs{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--bd);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--mu);vertical-align:middle;margin-right:8px}
</style>
</head>

<div id="v"></div>
</main>

function note(t){let d=$("#toast");if(!d){d=document.createElement("div");d.id="toast";d.style.cssText="position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:50;padding:12px 14px;border-radius:12px;font-weight:600;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:640px;margin:0 auto";document.body.appendChild(d)}d.style.background=/✔/.test(t)?"#1a7f4b":"#d9534f";d.textContent=t;d.style.display="block";clearTimeout(note.t);note.t=setTimeout(()=>d.style.display="none",6000)}
function sure(t){return new Promise(ok=>{const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px";o.innerHTML=`<div class="box" style="max-width:360px;margin:0"><p style="margin:0 0 6px">${esc(t)}</p><div class="row"><button class="btn s" id="sn">Cancel·la</button><button class="btn" id="sy" style="margin:0">Sí</button></div></div>`;document.body.appendChild(o);const e=v=>{o.remove();ok(v)};o.querySelector("#sn").onclick=()=>e(false);o.querySelector("#sy").onclick=()=>e(true);o.querySelector("#sy").focus()})}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function init(){
  document.documentElement.lang=LANG;langUI();trNode(document.body);
  render();
  try{db=LegendsDB(SUPABASE_URL,SUPABASE_KEY)}catch(e){console.error(e);db=null}
  try{uid=localStorage.getItem("uid");if(!uid){uid=crypto.randomUUID();localStorage.setItem("uid",uid)}}catch(e){uid=crypto.randomUUID()}
  let ac=null;try{ac=localStorage.getItem("adminCode")}catch(e){}
  if(db&&ac){try{if(await db.checkAdmin(ac)){db.setAdmin(ac);isOwner=true}else localStorage.removeItem("adminCode")}catch(e){console.error(e)}}
  langUI();
  if(!isOwner&&(tab==="cartes"||tab==="partits"))tab="puntuar";
  if(!db){$("#v").insertAdjacentHTML("afterbegin",'<div class="box">No s’ha pogut connectar amb la base de dades. Torna-ho a provar més tard.</div>');return}
  const sub=(c,fn)=>db.collection(c).onSnapshot(s=>{fn(s.docs.map(d=>({id:d.id,...d.data()})));render()},e=>console.error(e));
  sub("players",a=>players=a.sort((x,y)=>x.name.localeCompare(y.name)));
  sub("fixtures",a=>fixtures=a);
  sub("matches",a=>matches=a.sort((x,y)=>(y.date||"").localeCompare(x.date||"")||(y.createdAt||0)-(x.createdAt||0)));
  if(uid)db.doc("votes/"+uid).onSnapshot(d=>{myBy=(d.exists&&d.data().byMatch)||{};render()},e=>console.error(e));
  if(isOwner)db.collection("votes").onSnapshot(c=>{votes=[];c.docs.forEach(d=>{const b=d.data().byMatch||{};for(const m in b)votes.push({...b[m],matchId:b[m].matchId||m,uid:d.id})});render()},e=>console.error(e));
}
function render(){

function vJug(){

  ${players.map(p=>`<div class="box row" style="align-items:center"><div style="flex:none" data-ph="${p.id}">${av(p,"av")}</div><div style="flex:3"><b>${esc(p.name)}</b>${p.injured?" 🤕":""}<div class="mu">${(POS.find(q=>q[0]===posOf(p))||[0,"Sense posició"])[1]} · toca la foto per canviar-la</div></div>
  <select data-pos="${p.id}" style="flex:none;width:auto"><option value="">Posició</option>${POS.map(([k])=>`<option value="${k}" ${posOf(p)===k?"selected":""}>${k}</option>`).join("")}</select><button class="btn s ${p.injured?"on":""}" data-inj="${p.id}">🤕 Lesionat</button><button class="del" data-rm="${p.id}">✕</button></div>`).join("")||'<p class="mu">Afegeix els jugadors de la plantilla. La foto es posa una sola vegada per a tota la temporada.</p>'}
  <input type="file" accept="image/*" id="file" hidden>`;
  const up=(id,d)=>db&&db.doc("players/"+id).update(d).catch(e=>note(e.message||e.code));
  $("#add").onclick=async()=>{const n=$("#nn").value.trim();if(!n||!db)return;try{await db.collection("players").doc().set({name:n,pos:$("#np").value,gk:$("#np").value==="POR",injured:false,photo:""})}catch(e){note(e.message||e.code)}};
  $("#v").querySelectorAll("[data-pos]").forEach(b=>b.onchange=()=>up(b.dataset.pos,{pos:b.value,gk:b.value==="POR"}));

/* ---------- CARTES (només admin) ---------- */

    M.forEach(m=>{const e=m.players.find(q=>q.id===p.id);if(e){x.pj++;x.g+=e.g||0;x.a+=e.a||0;x.y+=e.y||0;x.r+=e.r||0}});

const MAP=Object.fromEntries(DICT),LT=/[\p{L}\p{N}]/u;
const RX=new RegExp(DICT.map(d=>d[0]).sort((a,b)=>b.length-a.length).map(k=>"(?:"+(LT.test(k[0])?"(?<![\\p{L}\\p{N}])":"")+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+(LT.test(k[k.length-1])?"(?![\\p{L}\\p{N}])":"")+")").join("|"),"gu");
const tr=t=>LANG==="es"?t.replace(RX,m=>MAP[m]):t;
function trNode(n){
  if(LANG!=="es")return;
  if(n.nodeType===3){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;return}
  if(n.nodeType!==1||n.tagName==="SCRIPT"||n.tagName==="STYLE")return;
  ["placeholder","title","aria-label","label"].forEach(a=>{if(n.hasAttribute(a))n.setAttribute(a,tr(n.getAttribute(a)))});
  n.childNodes.forEach(trNode);
}
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(trNode))).observe(document.body,{childList:true,subtree:true});

}
